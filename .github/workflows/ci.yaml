name: CI

env:
  # https://turborepo.com/docs/crafting-your-repository/constructing-ci#enabling-remote-caching
  # https://vercel.com/docs/monorepos/remote-caching#use-remote-caching-from-external-ci/cd
  TURBO_TOKEN: ${{ secrets.vercel_token }}
  TURBO_TEAM: "ruancat-projects"

on:
  push:
    branches:
      - dev

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - name: 检出分支
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装pnpm和node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24.18.0
          cache: true
          install: false

      - name: 安装项目依赖
        run: pnpm install -r

      - name: 安装全局工具
        run: pnpm add -g vercel @dotenvx/dotenvx tsx turbo

      - name: 检查版本
        run: |
          node -v
          pnpm -v
          vc -v
          turbo --version

      - name: pnpm全局检查依赖包
        run: pnpm ls -g

      - name: turbo login 远程登录
        run: turbo login --token=${{env.TURBO_TOKEN}} --team=${{env.TURBO_TEAM}}

      - name: turbo link 链接远程项目
        run: turbo link --token=${{env.TURBO_TOKEN}} --scope=${{env.TURBO_TEAM}} --yes

      - name: turbo并发打包全部子项目
        run: pnpm run ci
